<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kunkunkunkunkun</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700;900&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-start: #1e1b4b;
      --bg-mid: #1e3a8a;
      --bg-end: #0f766e;
      --accent: #ec4899;
      --accent-soft: #fbcfe8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Quicksand', 'Noto Sans TC', sans-serif;
      background: linear-gradient(145deg, var(--bg-start) 0%, var(--bg-mid) 52%, var(--bg-end) 100%);
      color: #f8fafc;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .serif-title {
      font-family: 'Noto Serif TC', serif;
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .float-card {
      animation: floatCard 5s ease-in-out infinite;
    }
    @keyframes flameFlicker {
      0%, 100% { transform: scale(1) rotate(-2deg); opacity: 1; }
      50% { transform: scale(1.14, 0.92) rotate(2deg); opacity: 0.9; }
    }
    .flame-anim {
      animation: flameFlicker 1.2s infinite ease-in-out;
      transform-origin: bottom center;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(22px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in-up {
      animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes pulseGift {
      0%, 100% { transform: scale(1) rotate(0deg); }
      25% { transform: scale(1.06) rotate(-3deg); }
      75% { transform: scale(1.06) rotate(3deg); }
    }
    .gift-bounce {
      animation: pulseGift 2s infinite ease-in-out;
    }
    /* 3D 翻轉卡片效果 */
.flip-card {
  perspective: 1200px;
  cursor: pointer;
}
.flip-inner {
  display: grid;
  transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1);
  transform-style: preserve-3d;
}
.flip-card.is-flipped .flip-inner {
  transform: rotateY(180deg);
}
.flip-front,
.flip-back {
  grid-area: 1 / 1; /* 讓正反面自動重疊，並依內容自動撐開高度 */
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}
.flip-back {
  transform: rotateY(180deg);
}
  </style>
</head>
<body class="relative select-none sm:select-auto">

  <!-- Fullscreen Effects Canvas (Fireworks, Balloons, Sparkles) -->
  <canvas id="fxCanvas" class="fixed inset-0 pointer-events-none z-20"></canvas>

  <!-- Gift Box Surprise Intro Overlay -->
  <div id="giftIntroOverlay" class="fixed inset-0 z-50 flex flex-col items-center justify-center p-6 text-center transition-all duration-700"
       style="background: radial-gradient(circle at center, #1e3a8a 0%, #1e1b4b 100%);">
    <div class="max-w-md w-full bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl p-8 shadow-2xl">
      <p class="text-xs uppercase tracking-widest text-amber-300 font-bold mb-2">✨ EXCLUSIVE BIRTHDAY SURPRISE ✨</p>
      <h2 class="text-2xl sm:text-3xl font-black text-white mb-2">給 豬姊姊🐖 的</h2>
      <p class="text-sm text-slate-200 mb-7">有一份專屬於你的禮物已經送達，請點擊下方禮物盒拆開它！</p>

      <button id="openGiftBtn" type="button" class="group relative inline-flex flex-col items-center justify-center focus:outline-none">
        <div class="w-28 h-28 sm:w-32 sm:h-32 rounded-3xl bg-gradient-to-tr from-pink-500 via-rose-500 to-amber-400 flex items-center justify-center shadow-2xl shadow-pink-500/50 gift-bounce cursor-pointer border-4 border-white/40">
          <span class="text-6xl sm:text-7xl">🎁</span>
        </div>
        <span class="mt-5 px-6 py-2.5 rounded-full bg-white text-slate-900 font-black text-sm shadow-lg group-hover:bg-amber-300 transition">
          👆 點擊拆開禮物
        </span>
      </button>
    </div>
  </div>

  <!-- Floating Top Controls (Music & Firework Trigger) -->
  <div class="fixed top-4 right-4 z-30 flex items-center gap-2">
    <button id="musicToggleBtn" type="button"
            class="px-3.5 py-2 rounded-full bg-white/90 hover:bg-white text-slate-900 shadow-lg backdrop-blur-md text-xs font-black flex items-center gap-1.5 transition active:scale-95">
            <span id="musicIcon">🎵</span>
            <span id="musicLabel">播放生日八音盒</span>
          </button>
    <button id="burstFireworkBtn" type="button"
      class="px-3.5 py-2 rounded-full bg-pink-500/90 hover:bg-pink-500 text-white shadow-lg backdrop-blur-md text-xs font-black flex items-center gap-1.5 transition active:scale-95">
      <span>🎆</span>
      <span>放煙火</span>
    </button>
  </div>

  <!-- Main Birthday Content Container -->
  <main class="relative z-10 max-w-4xl mx-auto px-4 sm:px-6 py-10 sm:py-14 flex flex-col items-center">

    <!-- Recipient Badge -->
    <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/15 backdrop-blur-md border border-white/25 text-xs sm:text-sm font-bold text-amber-200 mb-4 fade-in-up">
      <span>🎉</span>
      <span>HAPPY BIRTHDAY TO 豬姊姊🐖</span>
      <span>🎉</span>
    </div>

    <!-- Main Headline -->
    <h1 class="serif-title text-2xl sm:text-4xl md:text-5xl font-black text-center text-white drop-shadow-lg leading-tight mb-6 sm:mb-8 max-w-2xl fade-in-up">
      祝你生日快樂！
    </h1>

    <!-- Hero Birthday Illustration Card with Smart On-Image Banner -->
   <!-- 最上方：可翻轉的慶生大圖 + 背面祝福卡片 -->
<div class="flip-card w-full max-w-2xl mb-8 fade-in-up" onclick="this.classList.toggle('is-flipped')">
  <div class="flip-inner">

    <!-- 正面：原本的怕洽狗慶生大圖 -->
    <div class="flip-front relative rounded-3xl overflow-hidden shadow-2xl border border-white/40">
      <!-- ★ 把這裡的 src 換成你原本慶生圖片的檔名或網址 ★ -->
      <img src="1.png"
           alt="生日快樂"
           class="w-full h-full object-cover">
      <!-- 右下角小提示（不想顯示可以刪掉這行） -->
      <span class="absolute bottom-3 right-3 px-3.5 py-1.5 rounded-full bg-black/50 text-white text-xs font-bold backdrop-blur-sm animate-pulse">
         點擊圖片翻面看卡片 
      </span>
    </div>

    <!-- 背面：你原本完整的祝福卡片 -->
    <section class="flip-back rounded-3xl p-6 sm:p-10 shadow-2xl border border-white/40 backdrop-blur-xl overflow-hidden flex flex-col justify-between"
             style="background: rgba(255, 255, 255, 0.90); color: #1e293b;">
      <div>
        <!-- 頭像圖片 -->
        <img src="avatar.jpg"
             alt="頭像"
             class="w-24 h-24 rounded-full object-cover border-4 border-pink-200 shadow-md mb-4">

        <div class="flex items-center justify-between border-b border-current/10 pb-3 mb-3">
          <div class="flex items-center gap-2.5">
            <span class="text-2xl">💌</span>
            <div>
              <div class="text-xs font-bold uppercase tracking-wider opacity-60">DEAREST BIRTHDAY STAR</div>
              <div class="text-lg sm:text-xl font-black" style="color: #ec4899;">
                給 豬姊姊🐖
              </div>
            </div>
          </div>
        </div>

        <!-- Main Heartfelt Paragraphs -->
        <div class="serif-title text-base sm:text-lg leading-loose tracking-wide font-semibold mb-6">
          生日快樂！🎉<br/>祝你抽盲盒都中怕洽狗<br/>抽越來越多怕洽狗公仔和娃娃<br/>每天都一樣漂亮、身體健康<br/>帶我繼續吃好吃的😀
        </div>
      </div>

      <!-- Sender Signature -->
      <div class="flex items-center justify-between border-t border-current/10 pt-4">
        <span class="text-xs font-bold opacity-40">👆 點擊翻回圖片</span>
        <span class="text-base sm:text-lg font-black" style="color: #ec4899;">
          KUN 敬上 
        </span>
      </div>
    </section>

  </div>
</div>

    <!-- Interactive Blow-Out Birthday Candle Section -->
    <div class="w-full max-w-md mb-8 bg-white/15 backdrop-blur-xl border border-white/25 rounded-3xl p-5 text-center shadow-xl fade-in-up">
      <p id="candlePromptText" class="text-xs sm:text-sm font-bold text-amber-200 mb-3">
        🕯️ 閉上眼睛許個願，然後點擊下方蠟燭吹熄它吧！
      </p>
      <button id="blowCandleBtn" type="button" class="group relative inline-flex flex-col items-center justify-center py-2 px-6 rounded-2xl hover:bg-white/10 transition cursor-pointer">
        <!-- SVG Birthday Candle -->
        <svg width="70" height="96" viewBox="0 0 70 96" class="overflow-visible">
          <!-- Glowing Halo -->
          <circle id="candleHalo" cx="35" cy="22" r="24" fill="#fde047" fill-opacity="0.35" class="flame-anim"/>
          <!-- Flame -->
          <g id="candleFlameGroup" class="flame-anim">
            <path d="M35,4 C26,16 24,28 35,34 C46,28 44,16 35,4 Z" fill="#f97316"/>
            <path d="M35,11 C30,19 29,27 35,32 C41,27 40,19 35,11 Z" fill="#fef08a"/>
          </g>
          <!-- Wick -->
          <rect x="33.5" y="33" width="3" height="7" fill="#334155"/>
          <!-- Candle Body -->
          <rect x="21" y="40" width="28" height="48" rx="6" fill="#ffffff" stroke="#f472b6" stroke-width="3"/>
          <path d="M21,54 L49,44 M21,68 L49,58 M21,82 L49,72" stroke="#f472b6" stroke-width="4"/>
          <!-- Base Plate -->
          <ellipse cx="35" cy="89" rx="24" ry="5" fill="#fde047"/>
        </svg>
        <span id="candleActionBadge" class="mt-2 px-4 py-1 rounded-full bg-amber-400 text-slate-900 font-black text-xs shadow group-hover:scale-105 transition">
          🌬️ 點擊吹蠟燭許願
        </span>
      </button>
    </div>

    <footer class="mt-10 text-center text-xs text-white/60">
      <p> </p>
    </footer>
  </main>

  <script>
    (function() {
      const CONFIG = {
        balloons: false,
        fireworks: true,
        sparkles: true,
        musicBox: true,
        balloonColors: ["#f472b6","#38bdf8","#facc15","#c084fc","#fb7185"]
      };

      const canvas = document.getElementById('fxCanvas');
      const ctx = canvas.getContext('2d');
      let W = window.innerWidth;
      let H = window.innerHeight;

      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      // 1. Floating Balloons
      const balloons = [];
      if (CONFIG.balloons) {
        for (let i = 0; i < 14; i++) {
          balloons.push({
            x: Math.random() * W,
            y: H + Math.random() * H,
            r: 18 + Math.random() * 14,
            speedY: 0.7 + Math.random() * 1.1,
            swayAmp: 0.4 + Math.random() * 0.8,
            swaySpeed: 0.01 + Math.random() * 0.02,
            phase: Math.random() * Math.PI * 2,
            color: CONFIG.balloonColors[i % CONFIG.balloonColors.length]
          });
        }
      }

      // 2. Sparkles & Confetti
      const sparkles = [];
      if (CONFIG.sparkles) {
        for (let i = 0; i < 42; i++) {
          sparkles.push({
            x: Math.random() * W,
            y: Math.random() * H,
            size: 2 + Math.random() * 4.5,
            speedY: 0.4 + Math.random() * 0.9,
            speedX: (Math.random() - 0.5) * 0.6,
            alpha: 0.3 + Math.random() * 0.7,
            color: CONFIG.balloonColors[i % CONFIG.balloonColors.length]
          });
        }
      }

      // 3. Fireworks Particles
      const particles = [];
      function spawnFirework(cx, cy) {
        const x = cx || (W * 0.2 + Math.random() * W * 0.6);
        const y = cy || (H * 0.15 + Math.random() * H * 0.4);
        const count = 38;
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.2;
          const speed = 2 + Math.random() * 4.5;
          particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            alpha: 1,
            decay: 0.014 + Math.random() * 0.012,
            color: CONFIG.balloonColors[i % CONFIG.balloonColors.length],
            size: 2.5 + Math.random() * 2.5
          });
        }
      }
      window.triggerCelebrationFireworks = function() {
        for (let i = 0; i < 4; i++) {
          setTimeout(() => spawnFirework(), i * 260);
        }
      };

      if (CONFIG.fireworks) {
        setTimeout(() => spawnFirework(), 600);
        setInterval(() => {
          if (Math.random() < 0.65) spawnFirework();
        }, 2800);
      }

      function animate() {
        ctx.clearRect(0, 0, W, H);

        // Draw Sparkles
        for (const s of sparkles) {
          s.y += s.speedY;
          s.x += s.speedX;
          if (s.y > H + 10) { s.y = -10; s.x = Math.random() * W; }
          ctx.save();
          ctx.globalAlpha = s.alpha;
          ctx.fillStyle = s.color;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // Draw Floating Balloons
        for (const b of balloons) {
          b.y -= b.speedY;
          b.phase += b.swaySpeed;
          b.x += Math.sin(b.phase) * b.swayAmp;
          if (b.y < -80) {
            b.y = H + 60;
            b.x = Math.random() * W;
          }
          ctx.save();
          ctx.globalAlpha = 0.82;
          ctx.fillStyle = b.color;
          ctx.beginPath();
          ctx.ellipse(b.x, b.y, b.r * 0.85, b.r, 0, 0, Math.PI * 2);
          ctx.fill();
          // Highlight
          ctx.fillStyle = 'rgba(255,255,255,0.45)';
          ctx.beginPath();
          ctx.ellipse(b.x - b.r * 0.28, b.y - b.r * 0.3, b.r * 0.16, b.r * 0.26, -0.4, 0, Math.PI * 2);
          ctx.fill();
          // String
          ctx.strokeStyle = 'rgba(255,255,255,0.5)';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(b.x, b.y + b.r);
          ctx.quadraticCurveTo(b.x + 6, b.y + b.r + 18, b.x - 3, b.y + b.r + 36);
          ctx.stroke();
          ctx.restore();
        }

        // Draw Firework Particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.05; // gravity
          p.alpha -= p.decay;
          if (p.alpha <= 0) {
            particles.splice(i, 1);
            continue;
          }
          ctx.save();
          ctx.globalAlpha = p.alpha;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        requestAnimationFrame(animate);
      }
      animate();

      // Web Audio API Synthesizer for "Happy Birthday" Music Box
      let audioCtx = null;
      let isPlayingMusic = false;
      let musicTimer = null;

      const MELODY = [
        [261.63, 0.35], [261.63, 0.25], [293.66, 0.55], [261.63, 0.55], [349.23, 0.55], [329.63, 1.0],
        [261.63, 0.35], [261.63, 0.25], [293.66, 0.55], [261.63, 0.55], [392.00, 0.55], [349.23, 1.0],
        [261.63, 0.35], [261.63, 0.25], [523.25, 0.55], [440.00, 0.55], [349.23, 0.55], [329.63, 0.55], [293.66, 0.9],
        [466.16, 0.35], [466.16, 0.25], [440.00, 0.55], [349.23, 0.55], [392.00, 0.55], [349.23, 1.1]
      ];

      function playMusicBoxLoop() {
        if (!isPlayingMusic) return;
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        let currentTime = audioCtx.currentTime + 0.08;
        let totalDuration = 0;

        MELODY.forEach(([freq, dur]) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, currentTime);

          gain.gain.setValueAtTime(0.001, currentTime);
          gain.gain.exponentialRampToValueAtTime(0.14, currentTime + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0001, currentTime + dur + 0.25);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(currentTime);
          osc.stop(currentTime + dur + 0.3);

          currentTime += dur;
          totalDuration += dur;
        });

        musicTimer = setTimeout(() => {
          if (isPlayingMusic) playMusicBoxLoop();
        }, totalDuration * 1000 + 400);
      }

      function toggleMusic(forceStart) {
        const musicBtn = document.getElementById('musicToggleBtn');
        const musicLabel = document.getElementById('musicLabel');
        if (!musicBtn) return;

        if (forceStart === true) {
          isPlayingMusic = true;
        } else {
          isPlayingMusic = !isPlayingMusic;
        }

        if (isPlayingMusic) {
          musicLabel.textContent = '暫停生日音樂';
          clearTimeout(musicTimer);
          playMusicBoxLoop();
        } else {
          musicLabel.textContent = '播放生日八音盒';
          clearTimeout(musicTimer);
        }
      }

      const musicToggleBtn = document.getElementById('musicToggleBtn');
      if (musicToggleBtn) {
        musicToggleBtn.addEventListener('click', () => toggleMusic());
      }

      // Gift Box Intro Handler
      const openGiftBtn = document.getElementById('openGiftBtn');
      const giftIntroOverlay = document.getElementById('giftIntroOverlay');
      if (openGiftBtn && giftIntroOverlay) {
        openGiftBtn.addEventListener('click', () => {
          giftIntroOverlay.style.opacity = '0';
          giftIntroOverlay.style.pointerEvents = 'none';
          setTimeout(() => giftIntroOverlay.classList.add('hidden'), 650);
          window.triggerCelebrationFireworks();
          if (CONFIG.musicBox && !false) {
            toggleMusic(true);
          }
        });
      }

      // Interactive Blow-Out Candle Handler
      const blowCandleBtn = document.getElementById('blowCandleBtn');
      if (blowCandleBtn) {
        let blown = false;
        blowCandleBtn.addEventListener('click', () => {
          const flame = document.getElementById('candleFlameGroup');
          const halo = document.getElementById('candleHalo');
          const prompt = document.getElementById('candlePromptText');
          const badge = document.getElementById('candleActionBadge');
          blown = !blown;
          if (blown) {
            if (flame) flame.style.display = 'none';
            if (halo) halo.style.display = 'none';
            if (prompt) prompt.textContent = '🎉 願望會實現的！';
            if (badge) badge.textContent = '✨ 重新點燃蠟燭';
            window.triggerCelebrationFireworks();
          } else {
            if (flame) flame.style.display = 'block';
            if (halo) halo.style.display = 'block';
            if (prompt) prompt.textContent = '🕯️ 閉上眼睛許個願，然後點擊下方蠟燭吹熄它吧！';
            if (badge) badge.textContent = '🌬️ 點擊吹蠟燭許願';
          }
        });
      }

      // Manual Firework Button
      const burstBtn = document.getElementById('burstFireworkBtn');
      if (burstBtn) {
        burstBtn.addEventListener('click', () => window.triggerCelebrationFireworks());
      }
    })();
  </script>
</body>
</html>
